# Entorno de "producción" monitoreado: app + Prometheus + Grafana
# Levantar:  docker compose -f monitoring/docker-compose.yml up -d --build
services:
  app:
    build: ..
    container_name: eva3-app
    ports: ["5000:5000"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # solo laboratorio local: ver el tablero sin login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
